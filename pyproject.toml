[project]
name = "risikopegel"
version = "0.1.0"
description = "Risikopegel: model-risk platform (credit PD/ECL, VaR/ES backtesting, macro forecasting, verified LLM explanations). Not investment advice."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "polars>=1.20",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "optbinning>=0.20",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    "xgboost>=3.4.1",
    "interpret-core>=0.7.8",
    "pyarrow>=26.0.1",
    "matplotlib>=3.11.2",
    "optuna>=5.0.0,<5.1",
    "arch>=8.0.0,<9",
]

[dependency-groups]
# Module C time-series foundation models; CPU-only torch (approved downloads, 2026-11-21)
fm = [
    "torch==2.14.1",
    "chronos-forecasting==2.3.2",
    "timesfm[torch]==3.0.2",
    "transformers>=5.22,<5.23",
]
# Streamlit dashboard (opt-in: `uv run --group dashboard ...`). 1.66.1: newest release at least two weeks old
dashboard = [
    "streamlit==1.66.1",
]
api = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pandas-stubs>=2.2",
    "httpx==0.28.1",
    "pre-commit==4.7.0",
]
# experiment tracking (opt-in: `uv run --group mlops ...`). mlflow-skinny: tracking client without the server stack
mlops = [
    "mlflow-skinny==3.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risikopegel"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["data", "results", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "N", "NPY"]
ignore = ["PLR2004", "PLR0913", "N803", "N806"]  # magic values in tests; X/y naming is the sklearn convention

[tool.ruff.lint.per-file-ignores]
# report generators: long German/English prose lines and typographic minus signs read better unwrapped
"scripts/report*.py" = ["E501", "RUF001"]
# German customer-facing text and prompts: prose lines read better unwrapped
"src/risikopegel/llm/labels.py" = ["E501"]
"scripts/r5_explain_llm.py" = ["E501"]
"tests/test_llm.py" = ["E501"]
# heavy optional imports (torch, transformers) are loaded lazily on purpose
"src/risikopegel/forecast/fm.py" = ["PLC0415"]
"scripts/r4_forecast.py" = ["PLC0415"]
"scripts/r5_text_signal.py" = ["PLC0415", "E501"]
"dashboard/*.py" = ["E501", "RUF001"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/risikopegel", "tests", "scripts"]
mypy_path = "src:scripts"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "optbinning.*", "catboost.*", "interpret.*", "statsmodels.*", "threadpoolctl",
          "chronos", "chronos.*", "timesfm", "timesfm.*", "streamlit", "mlflow", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["leakage: leakage guard tests (must stay green in CI)"]
filterwarnings = [
    # pandas-3 deprecations raised inside optbinning 1.0.0, not in our code
    "ignore::Warning:optbinning.*",
]

[tool.uv]
default-groups = ["dev", "api", "fm"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
