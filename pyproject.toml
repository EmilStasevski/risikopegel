[project]
name = "risikopegel"
version = "0.1.0"
description = "Risikopegel: model-risk platform (credit PD/ECL, VaR/ES backtesting, macro forecasting, verified LLM explanations). Not investment advice."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "polars>=1.20",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "optbinning>=0.20",
]

[dependency-groups]
dev = ["ruff>=0.9", "mypy>=1.14", "pytest>=8.3", "pandas-stubs>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risikopegel"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["data", "results", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "N", "NPY"]
ignore = ["PLR2004", "PLR0913", "N803", "N806"]  # magic values in tests; X/y naming is the sklearn convention

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/risikopegel", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "optbinning.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["leakage: leakage guard tests (must stay green in CI)"]
filterwarnings = [
    # pandas-3 deprecations raised inside optbinning 1.0.0, not in our code
    "ignore::Warning:optbinning.*",
]
