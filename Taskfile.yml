# Risikopegel: single entry point. Run `task --list`.
version: "3"

tasks:
  default:
    cmds: [task --list]
    silent: true

  setup:
    desc: Install locked dependencies
    cmds: [uv sync --locked]

  lint:
    desc: ruff (lint + format check) and mypy --strict
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy

  test:
    desc: All tests (offline)
    cmds: [uv run pytest]

  test:leakage:
    desc: Leakage and split-policy tests only
    cmds: [uv run pytest -m leakage]

  smoke:
    desc: Smoke-test scorecard on Give Me Some Credit (needs data/raw/givemesomecredit)
    cmds: [uv run python -W ignore scripts/smoke_gmsc_scorecard.py]

  data:gmsc:
    desc: Download Give Me Some Credit via Kaggle CLI (needs token + accepted rules)
    cmds:
      - mkdir -p data/raw/givemesomecredit
      - uvx --from kaggle --with six kaggle competitions download -c GiveMeSomeCredit -p data/raw/givemesomecredit
      - cd data/raw/givemesomecredit && unzip -o -q GiveMeSomeCredit.zip

  ci:
    desc: What CI runs
    cmds:
      - task: lint
      - task: test

  report:
    desc: Rebuild every table and plot from results/ (filled in as modules land)
    cmds:
      - uv run python scripts/report.py
