# Risikopegel: single entry point. Run `task --list`.
version: "3"

tasks:
  default:
    cmds: [task --list]
    silent: true

  setup:
    desc: Install locked dependencies
    cmds: [uv sync --locked]

  lint:
    desc: ruff (lint + format check) and mypy --strict
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy

  test:
    desc: All tests (offline)
    cmds: [uv run pytest]

  test:leakage:
    desc: Leakage and split-policy tests only
    cmds: [uv run pytest -m leakage]

  smoke:
    desc: Smoke-test scorecard on Give Me Some Credit (needs data/raw/givemesomecredit)
    cmds: [uv run python -W ignore scripts/smoke_gmsc_scorecard.py]

  data:gmsc:
    desc: Download Give Me Some Credit via Kaggle CLI (needs token + accepted rules)
    cmds:
      - mkdir -p data/raw/givemesomecredit
      - uvx --from kaggle --with six kaggle competitions download -c GiveMeSomeCredit -p data/raw/givemesomecredit
      - cd data/raw/givemesomecredit && unzip -o -q GiveMeSomeCredit.zip

  dbt:build:
    desc: Build DuckDB marts from data/raw with dbt (models + data tests) -> data/processed/risikopegel.duckdb
    dir: dbt
    cmds: [uv run dbt build --profiles-dir .]

  data:homecredit:
    desc: Download Home Credit via Kaggle CLI (~722 MB zip, 3.2 GB unpacked)
    cmds:
      - mkdir -p data/raw/homecredit
      - uvx --from kaggle --with six kaggle competitions download -c home-credit-default-risk -p data/raw/homecredit
      - cd data/raw/homecredit && unzip -o -q home-credit-default-risk.zip && sha256sum *.csv > SHA256SUMS

  data:series:check:
    desc: Verify every key in config/series.toml with a tiny request (saves nothing)
    cmds: [uv run python scripts/fetch_series.py --check]

  data:series:
    desc: Fetch full history of all ECB/Bundesbank/Eurostat series -> data/raw/<source>/
    cmds: [uv run python scripts/fetch_series.py]

  r2:tune:
    desc: Optuna search for all six PD models (hours; resumable) -> results/credit/hc_tuning/
    cmds: [uv run python scripts/r2_tune.py]

  r2:tuned:
    desc: Refit with tuned params, score test once, compare with the grid baseline, explain, figures
    cmds:
      - uv run python scripts/r2_challengers.py --params results/credit/hc_tuning/best_params.json
      - uv run python scripts/r2_compare_grid.py
      - uv run python scripts/r2_explain.py
      - uv run python scripts/r2_figures.py
      - uv run python scripts/r2_validate.py

  ci:
    desc: What CI runs
    cmds:
      - task: lint
      - task: test

  report:
    desc: Rebuild every table and plot from results/ (filled in as modules land)
    cmds:
      - uv run python scripts/report.py
